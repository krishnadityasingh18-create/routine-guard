[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "routine-guard"
version = "0.1.0"
description = "Learn a daily rhythm from any timestamped event stream and flag late starts, long silences and odd-hour activity."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Krishnaditya Singh" }]
requires-python = ">=3.11"
dependencies = ["tzdata; sys_platform == 'win32'"]
keywords = ["anomaly-detection", "elder-care", "smart-home", "routine", "time-series"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.urls]
Source = "https://github.com/krishnadityasingh18-create/routine-guard"

[tool.setuptools.package-data]
routine_guard = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
